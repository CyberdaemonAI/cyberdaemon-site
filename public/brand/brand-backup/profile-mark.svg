<!-- cyberdaemon.ai profile mark — interim typographic mark
     Export to PNG before uploading to social platforms:
     1. Open in Chrome/Firefox (loads Google Fonts)
     2. Screenshot or use browser print-to-PDF > crop
     3. Or open in Figma, convert text to outlines, export PNG
     Sizes: LinkedIn org 300x300px, Threads 400x400px, favicon 32x32px

     Full logo design: separate bead (AI-tools path, Maxwell's Demon concept)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@1,8..60,300&amp;display=swap');
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="400" height="400" fill="#111210"/>

  <!-- Partial derivative symbol — the daemon mark -->
  <text
    x="200"
    y="200"
    font-family="'Source Serif 4', Georgia, serif"
    font-style="italic"
    font-weight="300"
    font-size="260"
    fill="#00c8a0"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-4">∂</text>
</svg>
