<!-- cyberdaemon.ai LinkedIn org banner — 1128x191px
     Export to PNG at 1128x191 before uploading.
     Open in Chrome (loads Google Fonts) then screenshot or use Figma.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@1,8..60,300&amp;display=swap');
    </style>
  </defs>

  <!-- Canvas — warm dark -->
  <rect width="1128" height="191" fill="#111210"/>

  <!-- Subtle teal accent line — left edge -->
  <rect x="0" y="0" width="3" height="191" fill="#00c8a0"/>

  <!-- ∂ mark — left zone -->
  <text
    x="96"
    y="96"
    font-family="'Source Serif 4', Georgia, serif"
    font-style="italic"
    font-weight="300"
    font-size="110"
    fill="#00c8a0"
    text-anchor="middle"
    dominant-baseline="central">∂</text>

  <!-- Separator -->
  <rect x="152" y="48" width="1" height="95" fill="#2e2c29"/>

  <!-- Wordmark — cyberdaemon.ai -->
  <text
    x="176"
    y="86"
    font-family="'Inter', -apple-system, sans-serif"
    font-weight="600"
    font-size="32"
    fill="#e8e5de"
    letter-spacing="-0.5">cyberdaemon.ai</text>

  <!-- Tagline -->
  <text
    x="176"
    y="118"
    font-family="'Inter', -apple-system, sans-serif"
    font-weight="400"
    font-size="15"
    fill="#706e68"
    letter-spacing="0">Practitioner writing on autonomous agents, AI security, and infrastructure</text>
</svg>
