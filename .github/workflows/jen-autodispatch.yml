# vault-2efvr: Jen Draft Auto-Dispatch
# Scans daemonprompt/prometheus-drafts for jen-queue beads with matching draft files.
# For each match: wraps as MDX, creates branch, opens PR to cyberdaemon-site.
#
# docs/03: Python scripts follow coding standards (error handling, explicit paths).
# docs/06: permissions deny-by-default, SHA-pinned actions.
#
# Prerequisites:
#   VAULT_DEPLOY_KEY_TOKEN -- fine-grained PAT, Contents: Read-only on daemonprompt/prometheus-drafts
#   vault-if9n9 Windows watcher must be running to push drafts to prometheus-drafts
name: Jen Draft Auto-Dispatch

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      bead_id:
        description: 'Specific bead ID to dispatch (optional, dispatches all ready if blank)'
        required: false

permissions: {}

jobs:
  dispatch:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout cyberdaemon-site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Checkout prometheus-drafts (draft source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: daemonprompt/prometheus-drafts
          token: ${{ secrets.VAULT_DEPLOY_KEY_TOKEN }}
          path: vault

      - name: Find ready jen-queue drafts
        id: find
        run: python3 .github/scripts/jen_autodispatch.py
        env:
          VAULT_PATH: vault
          BEAD_FILTER: ${{ inputs.bead_id }}

      - name: Open PRs for ready drafts
        if: steps.find.outputs.ready_count != '0'
        run: python3 .github/scripts/jen_open_prs.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READY_BEADS: ${{ steps.find.outputs.ready_beads }}
          VAULT_PATH: vault
