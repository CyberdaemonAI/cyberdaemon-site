name: Publish Gate
# vault-tb3: Blocks merge of jen/* and content/* PRs until 'rex-approved' label is present.
# Rex dispatched by rex-review.yml. When Rex posts [CONTENT REVIEW] with 'Rec: Approve',
# rex-verdict.yml adds 'rex-approved' label and this gate re-runs via pull_request_target: labeled.
#
# No bypass path: merge to master requires this check to pass.
# Post-deploy: add "Publish Gate / check-rex-verdict" as a required status check in
# branch protection for master (GitHub Settings -> Branches -> master -> Required status checks).

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  check-rex-verdict:
    # Fires on content/* and jen/* branch PRs (canonical content pipeline branches).
    # Also fires on ANY branch that touches src/content/ -- catches wrong-prefix branches
    # that would otherwise bypass Rex review and Casey's approval gate.
    # Run on labeled event for rex-approved to re-evaluate the gate after Rex verdict.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect content file changes
        id: content_check
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          CHANGED=$(git diff --name-only origin/master...HEAD 2>/dev/null || echo "")
          HAS_CONTENT=$(echo "$CHANGED" | grep -q "^src/content/.*\.mdx$" && echo "true" || echo "false")
          IS_CONTENT_BRANCH="false"
          if [[ "$BRANCH" == jen/* ]] || [[ "$BRANCH" == content/* ]]; then
            IS_CONTENT_BRANCH="true"
          fi
          echo "has_content_changes=${HAS_CONTENT}" >> "$GITHUB_OUTPUT"
          echo "is_content_branch=${IS_CONTENT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH — is_content_branch=${IS_CONTENT_BRANCH} has_content_changes=${HAS_CONTENT}"

      - name: Skip if not a content PR
        if: >
          steps.content_check.outputs.has_content_changes == 'false' &&
          steps.content_check.outputs.is_content_branch == 'false'
        run: echo "Not a content PR — publish gate skipped."

      - name: Warn on wrong branch prefix with content changes
        if: >
          steps.content_check.outputs.has_content_changes == 'true' &&
          steps.content_check.outputs.is_content_branch == 'false'
        run: |
          echo "::warning::Content files changed on branch '${{ steps.content_check.outputs.branch }}' — expected content/* or jen/* prefix."
          echo "::warning::This PR will be held at the publish gate. Rex review required."

      - name: Check for rex-approved label
        id: label_check
        if: >
          steps.content_check.outputs.has_content_changes == 'true' ||
          steps.content_check.outputs.is_content_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          HAS_LABEL=$(gh api \
            "repos/CyberdaemonAI/cyberdaemon-site/issues/${PR_NUMBER}/labels" \
            --jq '[.[].name] | contains(["rex-approved"])' 2>/dev/null || echo "false")

          echo "has_label=${HAS_LABEL}" >> "$GITHUB_OUTPUT"

          if [ "$HAS_LABEL" = "true" ]; then
            echo "Publish gate: PASS — rex-approved label is present."
          else
            echo "Publish gate: BLOCKED"
            echo ""
            echo "The 'rex-approved' label is not present on this PR."
            echo "Pipeline:"
            echo "  1. content-check must pass (already required by rex-review.yml)"
            echo "  2. rex-review.yml dispatches Rex to post a [CONTENT REVIEW] verdict"
            echo "  3. rex-verdict.yml fires on Rex's comment and adds 'rex-approved' if Rec: Approve"
            echo "  4. This gate re-runs automatically on the labeled event and passes"
            echo "  5. Casey Telegram /approve -> bot merges -> post publishes"
            exit 1
          fi
