# vault-apg6j: Post-deploy smoke test suite
# Runs on every PR to master. Tests against the live deployed site by default.
# Three suites: page loads, mermaid SVG render, OG tag presence.
#
# ISA gaps noted:
# 1. runs-on: ubuntu-latest used (ISA specified [self-hosted, infra1] but no runner
#    registered for CyberdaemonAI org; docs/06 self-hosted runner applies to daemonprompt/).
# 2. PLAYWRIGHT_BASE_URL defaults to https://cyberdaemon.ai (live site). ISA specified
#    local preview, but @astrojs/vercel adapter does not support `npm run preview`.
#    Override via env var to test a specific Vercel preview URL when available.
#
# docs/06: permissions deny-by-default. SHA-pinned actions.
name: Smoke Tests

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL || 'https://cyberdaemon.ai' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke:ci

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
