# vault-apg6j: Post-deploy smoke test suite
# Runs on successful Vercel deployments only — deployment_status provides the
# preview URL, so tests always run against an actual build, not the live site.
# pull_request trigger removed: no Vercel URL available in that context, causing
# all tests to fail when SMOKE_TEST_BASE_URL is unset (hits live site, unreliable).
#
# ISA gaps noted:
# 1. runs-on: ubuntu-latest used (ISA specified [self-hosted, infra1] but no runner
#    registered for CyberdaemonAI org; docs/06 self-hosted runner applies to daemonprompt/).
# 2. Zulip not integrated — notifications use Telegram to match existing infra.
#
# docs/06: permissions deny-by-default. SHA-pinned actions.
name: Smoke Tests

on:
  deployment_status: {}

permissions: {}

jobs:
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    # On deployment_status: only run when Vercel reports success
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success')
    permissions:
      contents: read
    env:
      # On deployment_status, test the exact Vercel preview URL.
      # On PR, fall back to repo var (or live site if unset).
      PLAYWRIGHT_BASE_URL: >-
        ${{ github.event_name == 'deployment_status'
            && github.event.deployment_status.target_url
            || vars.SMOKE_TEST_BASE_URL || 'https://cyberdaemon.ai' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke:ci

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 <<'PYEOF'
          import os, json, urllib.request
          status  = os.environ['STATUS']
          base    = os.environ['BASE_URL']
          run_url = os.environ['RUN_URL']
          trigger = os.environ['TRIGGER']
          icon    = '✅' if status == 'success' else '❌'
          msg     = f"{icon} Smoke {status} [{trigger}]\n{base}\n{run_url}"
          data    = json.dumps({'chat_id': os.environ['CHAT_ID'], 'text': msg}).encode()
          req     = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data=data,
              headers={'Content-Type': 'application/json'},
          )
          urllib.request.urlopen(req)
          PYEOF
