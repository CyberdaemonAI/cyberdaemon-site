name: Content Pipeline Notifications

on:
  pull_request:
    types: [opened, reopened]
    branches: [master]
    paths:
      - 'src/content/**'

jobs:
  notify-zulip:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened') }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract article metadata
        id: meta
        run: |
          # Find the first changed MDX file
          git fetch origin master --depth=1
          MDX_FILE=$(git diff --diff-filter=AM --name-only "origin/master"...HEAD \
            | grep '^src/content/.*\.mdx$' | head -1 || true)

          if [ -z "$MDX_FILE" ]; then
            echo "No MDX file found in PR"
            echo "title=Content PR" >> "$GITHUB_OUTPUT"
            echo "summary=New content pull request opened." >> "$GITHUB_OUTPUT"
            echo "lane=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract title from frontmatter
          TITLE=$(awk '/^---$/{if(++c==2)exit} c==1 && /^title:/{gsub(/^title:\s*"|"$/, ""); print}' "$MDX_FILE")
          LANE=$(echo "$MDX_FILE" | sed 's|src/content/\([^/]*\)/.*|\1|')

          # Extract first 3 sentences of body as summary
          SUMMARY=$(python3 - "$MDX_FILE" <<'PYEOF'
          import re, sys
          content = open(sys.argv[1]).read()
          content = re.sub(r'^---.*?---\n', '', content, flags=re.DOTALL)
          content = re.sub(r'^import .*$', '', content, flags=re.MULTILINE)
          content = re.sub(r'<[^>]+>', ' ', content)
          content = re.sub(r'\{`.*?`\}', ' ', content, flags=re.DOTALL)
          content = re.sub(r'```.*?```', ' ', content, flags=re.DOTALL)
          content = re.sub(r'\s+', ' ', content).strip()
          sentences = re.split(r'(?<=[.!?])\s+', content)
          print(' '.join(sentences[:3]))
          PYEOF
          )

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          # Truncate summary to avoid GitHub output limits
          echo "summary=${SUMMARY:0:400}" >> "$GITHUB_OUTPUT"
          echo "file=$MDX_FILE" >> "$GITHUB_OUTPUT"

      - name: Post to Zulip content-pipeline stream
        env:
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_REALM: ${{ secrets.ZULIP_REALM }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TITLE="${{ steps.meta.outputs.title }}"
          LANE="${{ steps.meta.outputs.lane }}"
          SUMMARY="${{ steps.meta.outputs.summary }}"

          MESSAGE="**[PR #${PR_NUMBER}] ${TITLE}**

Lane: ${LANE}

${SUMMARY}

Review: ${PR_URL}"

          curl -s -f \
            --data-urlencode "type=stream" \
            --data-urlencode "to=content-pipeline" \
            --data-urlencode "topic=PR #${PR_NUMBER}" \
            --data-urlencode "content=${MESSAGE}" \
            -u "${ZULIP_BOT_EMAIL}:${ZULIP_API_KEY}" \
            "${ZULIP_REALM}/api/v1/messages"

          echo "Zulip notification sent for PR #${PR_NUMBER}"
