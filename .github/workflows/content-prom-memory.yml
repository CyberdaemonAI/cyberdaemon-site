name: prom-memory Milestone on Publish

on:
  push:
    branches: [master]
    paths:
      - 'src/content/**/*.mdx'

jobs:
  save-milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find published article
        id: article
        run: |
          MDX_FILE=$(git diff --diff-filter=AM --name-only HEAD~1..HEAD \
            | grep '^src/content/.*\.mdx$' | head -1 || true)

          if [ -z "$MDX_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          SLUG=$(basename "$MDX_FILE" .mdx)
          LANE=$(echo "$MDX_FILE" | sed 's|src/content/\([^/]*\)/.*|\1|')
          TITLE=$(awk '/^---$/{if(++c==2)exit} c==1 && /^title:/{gsub(/^title:\s*"|"$/, ""); print}' "$MDX_FILE")

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Join Tailscale
        if: steps.article.outputs.found == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Save prom-memory milestone
        if: steps.article.outputs.found == 'true'
        env:
          PROM_MEMORY_TOKEN: ${{ secrets.PROM_MEMORY_TOKEN }}
        run: |
          SLUG="${{ steps.article.outputs.slug }}"
          LANE="${{ steps.article.outputs.lane }}"
          TITLE="${{ steps.article.outputs.title }}"
          SITE_URL="https://cyberdaemon.ai/${LANE}/${SLUG}"
          COMMIT_SHA="${{ github.sha }}"
          PUBLISHED_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          FACT_CONTENT="${TITLE} published at ${SITE_URL} on ${PUBLISHED_DATE} (commit ${COMMIT_SHA:0:8})"

          # Wait for Tailscale to establish routes
          sleep 5

          # Verify prom-memory reachable
          if ! curl -sf --max-time 10 \
            -H "Authorization: Bearer ${PROM_MEMORY_TOKEN}" \
            http://100.113.106.111:30860/health > /dev/null; then
            echo "ERROR: prom-memory not reachable via Tailscale"
            exit 1
          fi

          # Save milestone
          RESPONSE=$(curl -sf --max-time 15 \
            -X POST http://100.113.106.111:30860/add \
            -H "Authorization: Bearer ${PROM_MEMORY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"fact_type\": \"milestone\",
              \"content\": \"${FACT_CONTENT}\",
              \"context\": \"prometheus\",
              \"classification\": \"general\",
              \"source_agent\": \"github-actions\",
              \"decay_weight\": 0.9,
              \"confidence\": 1.0
            }" 2>&1)

          echo "prom-memory response: $RESPONSE"
          echo "Milestone saved: $FACT_CONTENT"
