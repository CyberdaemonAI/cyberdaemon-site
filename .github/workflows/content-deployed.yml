name: Content Deploy Notification

on:
  push:
    branches: [master]
    paths:
      - 'src/content/**/*.mdx'

permissions: {}

jobs:
  notify:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2

      - name: Extract deployed article metadata
        id: meta
        run: |
          # Find MDX files changed in this push
          CHANGED=$(git diff --diff-filter=AM --name-only HEAD~1 HEAD \
            | grep '^src/content/.*\.mdx$' | head -5 || true)

          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Build message lines for each article
          LINES=""
          while IFS= read -r f; do
            TITLE=$(awk '/^---$/{if(++c==2)exit} c==1 && /^title:/{gsub(/^title:[[:space:]]*"?|"?$/,""); print}' "$f")
            SLUG=$(awk '/^---$/{if(++c==2)exit} c==1 && /^slug:/{gsub(/^slug:[[:space:]]*/,""); print}' "$f")
            LANE=$(echo "$f" | sed 's|src/content/\([^/]*\)/.*|\1|')
            if [ -n "$SLUG" ]; then
              URL="https://cyberdaemon.ai/${LANE}/${SLUG}"
            else
              URL="https://cyberdaemon.ai"
            fi
            LINES="${LINES}Published: ${TITLE:-untitled}
${URL}
"
          done <<< "$CHANGED"

          # Write to file to avoid output limit issues
          echo "$LINES" > /tmp/deploy_lines.txt

      - name: Send Mattermost notification
        if: steps.meta.outputs.skip != 'true'
        env:
          MM_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          LINES=$(cat /tmp/deploy_lines.txt)
          MSG="**cyberdaemon.ai deployed**

${LINES}"
          if [ -z "$MM_WEBHOOK" ]; then
            echo "MATTERMOST_WEBHOOK_URL not set -- skipping notify"
            exit 0
          fi
          curl -s -X POST "$MM_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\": $(echo "$MSG" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}" \
            --fail-with-body || echo "Mattermost notify failed -- non-blocking"
