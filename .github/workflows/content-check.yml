name: Content Standards Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  content-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Get changed content files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            MDX_FILES=$(git diff --diff-filter=AM --name-only "origin/${{ github.base_ref }}"...HEAD \
              | grep '^src/content/.*\.mdx$' || true)
            NEW_MDX_FILES=$(git diff --diff-filter=A --name-only "origin/${{ github.base_ref }}"...HEAD \
              | grep '^src/content/.*\.mdx$' || true)
          else
            MDX_FILES=$(git diff --diff-filter=AM --name-only HEAD~1..HEAD \
              | grep '^src/content/.*\.mdx$' || true)
            NEW_MDX_FILES=$(git diff --diff-filter=A --name-only HEAD~1..HEAD \
              | grep '^src/content/.*\.mdx$' || true)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MDX_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "new_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_MDX_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check for banned internal names
        run: |
          echo "=== Checking for banned internal names (introduced lines only) ==="
          MDX_FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No changed .mdx files to check."
            exit 0
          fi

          FAIL=0

          # Scan only lines ADDED in this PR -- pre-existing violations are not our problem here
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ADDED=$(git diff "origin/${{ github.base_ref }}"...HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          else
            ADDED=$(git diff HEAD~1..HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          fi

          PATTERNS=(
            'daemon-:daemon- prefix (internal service names)'
            'vault-[a-zA-Z0-9]:vault- bead ID'
            'kubectl:kubectl reference'
            '[kK]3[sS]:K3s reference'
            '[tT][aA][iI][lL][sS][cC][aA][lL][eE]:Tailscale reference'
            '[zZ][uU][lL][iI][pP]:Zulip reference'
            '[aA][rR][gG][oO][cC][dD]:ArgoCD reference'
            '[lL][oO][nN][gG][hH][oO][rR][nN]:Longhorn reference'
            '[cC][iI][lL][iI][uU][mM]:Cilium reference'
            '[kK][eE][yY][cC][lL][oO][aA][kK]:Keycloak reference'
            '[bB]0[bB]:B0b agent name'
            'prom-memory:prom-memory reference'
            'prom_memory:prom_memory reference'
            '100\.[0-9]+\.[0-9]+\.[0-9]+:Tailscale IP address'
            '10\.10\.[0-9]+\.[0-9]+:LAN IP address'
            '10\.43\.[0-9]+\.[0-9]+:K3s service IP address'
          )

          for entry in "${PATTERNS[@]}"; do
            pattern="${entry%%:*}"
            label="${entry#*:}"
            matches=$(echo "$ADDED" | grep -E "$pattern" || true)
            if [ -n "$matches" ]; then
              echo ""
              echo "FAIL: New content introduces '$label':"
              echo "$matches"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Banned names in new content. See PUBLISHING-STANDARDS.md."
            exit 1
          else
            echo "No banned internal names in new content."
          fi

      - name: Check for em dashes
        run: |
          echo "=== Checking for em dashes (U+2014) -- introduced lines only ==="
          MDX_FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No changed .mdx files to check."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ADDED=$(git diff "origin/${{ github.base_ref }}"...HEAD -- $MDX_FILES \
              | grep '^+' | grep -v '^+++' || true)
          else
            ADDED=$(git diff HEAD~1..HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          fi
          matches=$(printf '%s' "$ADDED" | python3 -c "import sys; data=sys.stdin.read(); hits=[l for l in data.splitlines() if chr(8212) in l]; print('\n'.join(hits)) if hits else None" || true)
          if [ -n "$matches" ]; then
            echo "FAIL: Em dashes in new content:"
            echo "$matches"
            echo ""
            echo "Replace em dashes with commas, semicolons, colons, or restructure."
            exit 1
          else
            echo "No em dashes in new content."
          fi

      - name: Check for periods on titles
        run: |
          echo "=== Checking frontmatter titles for trailing periods — changed files only ==="
          MDX_FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No changed .mdx files to check."
            exit 0
          fi
          WARN=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            title_line=$(awk '/^---$/{if(++c==2)exit} c==1 && /^title:/' "$file")
            if echo "$title_line" | grep -qE '\.\s*["\x27]?\s*$'; then
              echo "WARN: Title ends with a period in $file"
              echo "  $title_line"
              WARN=1
            fi
          done <<< "$MDX_FILES"
          if [ "$WARN" -eq 1 ]; then
            echo ""
            echo "Titles should not end with periods."
          else
            echo "No trailing periods on titles."
          fi

      - name: Check for counterarguments section
        run: |
          echo "=== Checking for counterarguments section (new articles only) ==="
          MDX_FILES="${{ steps.changed.outputs.new_files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No new .mdx files to check."
            exit 0
          fi
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! grep -qiE '^## .*(counter|where.*wrong|what.*wrong|objection|pushback|the case against|what i.*wrong|wrong about)' "$file"; then
              echo "FAIL: No counterarguments section in $file"
              echo "  Add an H2 heading like: ## Counterarguments, ## Where I'm wrong, ## The case against this"
              FAIL=1
            fi
          done <<< "$MDX_FILES"
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Every article requires a counterarguments section. See STYLE-GUIDE.md."
            exit 1
          else
            echo "Counterarguments section found in all changed files."
          fi

      - name: Check for hedge words
        run: |
          echo "=== Checking for hedge words (introduced lines only) ==="
          MDX_FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No changed .mdx files to check."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ADDED=$(git diff "origin/${{ github.base_ref }}"...HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          else
            ADDED=$(git diff HEAD~1..HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          fi
          HEDGE_PATTERN='perhaps\b|arguably\b|it could be said|it should be noted|to some extent|in some ways|may or may not|might suggest|\bsomewhat\b|\brelatively\b'
          matches=$(echo "$ADDED" | grep -iE "$HEDGE_PATTERN" || true)
          if [ -n "$matches" ]; then
            echo "FAIL: Hedge words in new content:"
            echo "$matches"
            echo ""
            echo "Remove hedge words. Say it or don't. See STYLE-GUIDE.md."
            exit 1
          else
            echo "No hedge words in new content."
          fi

      - name: Check for banned buzzwords
        run: |
          echo "=== Checking for banned buzzwords (introduced lines only) ==="
          MDX_FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No changed .mdx files to check."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ADDED=$(git diff "origin/${{ github.base_ref }}"...HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          else
            ADDED=$(git diff HEAD~1..HEAD -- $MDX_FILES | grep '^+' | grep -v '^+++' || true)
          fi
          BUZZ_PATTERN='\brobust\b|\butilize\b|\bsynergy\b|\bnext-generation\b|\bcutting-edge\b|\bindustry-leading\b|\bseamless\b|\bactionable\b|\bleverage\b|\bholistic\b|\bpivot\b'
          matches=$(echo "$ADDED" | grep -iE "$BUZZ_PATTERN" || true)
          if [ -n "$matches" ]; then
            echo "FAIL: Buzzwords in new content:"
            echo "$matches"
            echo ""
            echo "Remove buzzwords. Use plain language. See STYLE-GUIDE.md."
            exit 1
          else
            echo "No buzzwords in new content."
          fi

      - name: Check required MDX component usage
        run: |
          echo "=== Checking required MDX components (new articles only) ==="
          MDX_FILES="${{ steps.changed.outputs.new_files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No new .mdx files to check."
            exit 0
          fi
          REQUIRED=("DiagramBlock" "PullQuote" "Callout" "SectionLabel")
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for component in "${REQUIRED[@]}"; do
              if ! grep -q "<${component}" "$file"; then
                echo "FAIL: Missing <${component}> in $file"
                FAIL=1
              fi
            done
          done <<< "$MDX_FILES"
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "All articles require DiagramBlock, PullQuote, Callout, SectionLabel. See STYLE-GUIDE.md."
            exit 1
          else
            echo "All required components present."
          fi

      - name: Check minimum word count
        run: |
          echo "=== Checking minimum word count (1000 words body text, new articles only) ==="
          MDX_FILES="${{ steps.changed.outputs.new_files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No new .mdx files to check."
            exit 0
          fi
          MIN_WORDS=1000
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            word_count=$(python3 - "$file" <<'PYEOF'
          import re, sys
          content = open(sys.argv[1]).read()
          content = re.sub(r'^---.*?---\n', '', content, flags=re.DOTALL)
          content = re.sub(r'<[^>]+>', ' ', content)
          content = re.sub(r'```.*?```', ' ', content, flags=re.DOTALL)
          content = re.sub(r'^import .*$', '', content, flags=re.MULTILINE)
          content = re.sub(r'\{`.*?`\}', ' ', content, flags=re.DOTALL)
          print(len(content.split()))
          PYEOF
            )
            if [ "$word_count" -lt "$MIN_WORDS" ]; then
              echo "FAIL: $file has $word_count words (minimum $MIN_WORDS)"
              FAIL=1
            else
              echo "OK: $file -- $word_count words"
            fi
          done <<< "$MDX_FILES"
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Articles must be at least $MIN_WORDS words. Expand the content."
            exit 1
          else
            echo "All files meet minimum word count."
          fi

      - name: Check Mermaid diagram quality
        run: |
          echo "=== Checking Mermaid diagram quality (new articles only) ==="
          MDX_FILES="${{ steps.changed.outputs.new_files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No new .mdx files to check."
            exit 0
          fi
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # After each ```mermaid fence, the next non-blank line is the diagram type declaration.
            # Ban: graph LR, graph TD, graph TB, graph RL, graph BT (old syntax -- use flowchart + subgraphs or sequenceDiagram)
            bad=$(awk '/^```mermaid/{found=1; next} found && /^[[:space:]]*$/{next} found{if(/^graph[[:space:]]+(LR|TD|TB|RL|BT)/) print NR": "$0; found=0}' "$file" || true)
            if [ -n "$bad" ]; then
              echo "FAIL: Old Mermaid graph syntax in $file (use flowchart+subgraphs or sequenceDiagram):"
              echo "$bad"
              FAIL=1
            fi
          done <<< "$MDX_FILES"
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Replace 'graph LR/TD/TB' with 'flowchart TD' (add subgraphs for grouping)"
            echo "or 'sequenceDiagram' for time-ordered processes. See STYLE-GUIDE.md."
            exit 1
          else
            echo "Mermaid diagram syntax OK."
          fi

      - name: Check opening hook length
        run: |
          echo "=== Checking opening hook length (warn if > 200 words before first section break) ==="
          MDX_FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$MDX_FILES" ]; then
            echo "No changed .mdx files to check."
            exit 0
          fi
          MAX_HOOK_WORDS=200
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            hook_words=$(python3 - "$file" <<'PYEOF'
          import re, sys
          content = open(sys.argv[1]).read()
          content = re.sub(r'^---.*?---\n', '', content, flags=re.DOTALL)
          content = re.sub(r'^import .*$', '', content, flags=re.MULTILINE)
          hook = content.split('\n---\n')[0] if '\n---\n' in content else content[:500]
          hook = re.sub(r'<[^>]+>', ' ', hook)
          print(len(hook.split()))
          PYEOF
            )
            if [ "$hook_words" -gt "$MAX_HOOK_WORDS" ]; then
              echo "WARN: $file opening hook is $hook_words words (recommended max $MAX_HOOK_WORDS)"
              echo "  Tighten the opening. Drop the reader into the problem faster."
            else
              echo "OK: $file -- $hook_words word opening hook"
            fi
          done <<< "$MDX_FILES"
          echo "Opening hook check complete (warnings only, not blocking)."


      - name: Check canonical tags (max 2, canonical set only)
        run: |
          echo "=== Checking frontmatter tags: canonical set + max 2 per article ==="
          CANONICAL="autonomous-agents ai-security ai-systems infrastructure research reflection"
          FAIL=0
          for file in $(find src/content -name "*.mdx" | sort); do
            tag_line=$(awk '/^---$/{if(++c==2)exit} c==1 && /^tags:/' "$file")
            [ -z "$tag_line" ] && continue
            tags=$(echo "$tag_line" | grep -oP '"[^"]+"' | tr -d '"')
            count=$(echo "$tags" | wc -w)
            if [ "$count" -gt 2 ]; then
              echo "FAIL: $file has $count tags (max 2): $tags"
              FAIL=1
            fi
            for tag in $tags; do
              valid=0
              for c in $CANONICAL; do
                [ "$tag" = "$c" ] && valid=1 && break
              done
              if [ "$valid" -eq 0 ]; then
                echo "FAIL: $file has non-canonical tag '$tag'"
                echo "  Allowed: $CANONICAL"
                FAIL=1
              fi
            done
          done
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Fix tags before merging. See STYLE-GUIDE.md for canonical tag list."
            exit 1
          else
            echo "All tags canonical and within limit."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  rex-dispatch:
    # vault-ne7: Dispatch Rex editorial review after content-check passes.
    # Runs only for PR events on jen/* or content/* branches.
    if: >
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'content/') ||
       startsWith(github.head_ref, 'jen/'))
    needs: content-check
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Post Rex dispatch notice to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          BODY="**Rex editorial pre-review dispatched** for: *${PR_TITLE}* -- Checking voice, accuracy, counterarguments. Review will be posted as a PR comment."
          gh pr comment "$PR_NUMBER" \
            --repo CyberdaemonAI/cyberdaemon-site \
            --body "$BODY" \
            || echo "PR comment post failed -- continuing"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Dispatch Rex editorial review
        continue-on-error: true
        run: |
          PR_NUMBER="${{ github.event.number }}"
          PR_URL="https://github.com/CyberdaemonAI/cyberdaemon-site/pull/${PR_NUMBER}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          BRANCH="${{ github.head_ref }}"

          TASK="You are Rex. Run an editorial pre-review of this cyberdaemon.ai content PR. Do NOT re-run CI hygiene checks -- CI already passed. PR: ${PR_URL} PR Number: ${PR_NUMBER} Title: ${PR_TITLE} Branch: ${BRANCH} Repo: CyberdaemonAI/cyberdaemon-site. Steps: 1. Clone the repo using the GITHUB_TOKEN env var: git clone https://\${GITHUB_TOKEN}@github.com/CyberdaemonAI/cyberdaemon-site.git /tmp/cyberdaemon-site && cd /tmp/cyberdaemon-site. 2. git fetch origin ${BRANCH} && git checkout ${BRANCH}. 3. Read the changed .mdx file vs master. 4. Read docs/STYLE-GUIDE.md. 5. Read exemplar articles. Review criteria: Voice (is this Taco?), Accuracy (unverified claims?), Counterarguments (steelmanned?). Watcher take: security/technical claims vs NIST SPs, RFCs, CVE database. Format: [CONTENT REVIEW] ${PR_TITLE}\nVoice: Pass|Flag\nAccuracy: Clean|list\nCounterarguments: Steelmanned|Strawmanned\nRec: Approve|Revise\nWatcher take: claim -> Accurate|Inaccurate. Post the review as a PR comment using node (available at /usr/local/bin/node, NOT python3 or gh). Write the review body to /tmp/review.txt first using Write tool. Then run: node -e "const https=require('https'),fs=require('fs'),token=process.env.GITHUB_TOKEN,body=JSON.stringify({body:fs.readFileSync('/tmp/review.txt','utf8')}),opts={hostname:'api.github.com',path:'/repos/CyberdaemonAI/cyberdaemon-site/issues/${PR_NUMBER}/comments',method:'POST',headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json','User-Agent':'rex','Content-Length':Buffer.byteLength(body)}};const req=https.request(opts,res=>{res.on('data',()=>{});res.on('end',()=>process.exit(res.statusCode<300?0:1))});req.on('error',e=>{console.error(e);process.exit(1)});req.write(body);req.end();""

          PAYLOAD=$(python3 -c "import json, sys; print(json.dumps({'task': sys.argv[1], 'channel_id': 'content-review'}))" "$TASK")

          # Rex Tailscale MagicDNS hostname (stable across pod restarts, current IP 100.103.38.78)
          REX_IP="rex"

          HEALTH=$(curl -sf --max-time 5 "http://${REX_IP}:8080/health" 2>/dev/null || echo '{}')
          BUSY=$(echo "$HEALTH" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('busy', True))" 2>/dev/null || echo 'true')

          if [ "$BUSY" = "True" ] || [ "$BUSY" = "true" ]; then
            echo "Rex is busy -- skipping for PR #${PR_NUMBER}"
            exit 0
          fi

          HTTP_STATUS=$(curl -sf --max-time 10 \
            -X POST "http://${REX_IP}:8080/run-task" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            -o /dev/null -w "%{http_code}" 2>/dev/null || echo '000')

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "202" ]; then
            echo "Rex dispatched for PR #${PR_NUMBER}"
          elif [ "$HTTP_STATUS" = "409" ]; then
            echo "Rex busy (409) -- review manually"
          else
            echo "Rex dispatch failed (HTTP ${HTTP_STATUS})"
            exit 1
          fi
